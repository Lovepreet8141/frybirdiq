<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FRYBIRD">
  <!--
    The tab icon. A filled red disc with a cream F, because at 16px the
    wordmark is an unreadable smear and a letterform is not.
    Served as a static metadata file, so nothing is generated per request —
    the route Next served in its place was trying to write a prerender cache
    to a read-only path on every load.
  -->
  <circle cx="32" cy="32" r="32" fill="#D92B2B"/>
  <path d="M22 15h22v9H31v6h11v9H31v10h-9z" fill="#F5EDD8" transform="skewX(-8) translate(4 0)"/>
</svg>
