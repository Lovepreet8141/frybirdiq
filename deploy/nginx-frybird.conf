# nginx: WordPress on the apex, the ordering app on a subdomain.
#
#   sudo cp deploy/nginx-frybird.conf /etc/nginx/sites-available/frybird
#   sudo ln -s /etc/nginx/sites-available/frybird /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue certificates:
#   sudo certbot --nginx -d frybird.in -d www.frybird.in -d order.frybird.in
#
# certbot rewrites these server blocks to add the TLS lines and a redirect from
# port 80. Run it after this file is in place, not before.

# ── The ordering app ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name order.frybird.in;

    # Next sets its own caching headers per route; nginx must not second-guess
    # them, or a dynamic page gets served stale to the next customer.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server Actions and streamed responses need these.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Immutable build assets. Hashed filenames, so a year is safe.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# ── WordPress ───────────────────────────────────────────────────────────────
# Left as a sketch: if Hostinger's VPS template installed a control panel, it
# already manages this block and editing it by hand will be overwritten. Point
# the root at wherever that panel put WordPress.
server {
    listen 80;
    server_name frybird.in www.frybird.in;
    root /var/www/wordpress;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # Never serve these, whatever WordPress thinks.
    location ~* /(?:wp-config\.php|readme\.html|license\.txt)$ { deny all; }

    client_max_body_size 64m;
}
