# nginx for frybirdiq.tech — the FRYBIRD ordering app and FRYBIRD IQ.
#
#   sudo cp deploy/nginx-frybird.conf /etc/nginx/sites-available/frybird
#   sudo ln -sf /etc/nginx/sites-available/frybird /etc/nginx/sites-enabled/frybird
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue certificates:
#   sudo certbot --nginx -d frybirdiq.tech -d www.frybirdiq.tech
#
# certbot rewrites this file to add the TLS lines and a redirect from port 80.
# Run it after this is in place, not before. certbot's nginx plugin copies
# the whole matched server block (every location in it) into the 443 block it
# creates, so the /api/jobs/ refusal and the server-level proxy headers below
# land in both blocks automatically the first time certbot runs against this
# file. If TLS is already issued on this box, re-add both by hand to the live
# 443 block and diff it against this file — see docs/DEPLOY.md §5a.

# SECURITY-TENANCY (iq0-s10r-sec): Connection needs to be "upgrade" only when
# the client actually asked to upgrade (Server-Sent Events / WebSocket-style
# streaming); otherwise a bare `Connection: upgrade` on every request breaks
# normal keep-alive. `map` must live outside `server{}` (http context) — this
# file is included from inside the `http {}` block in nginx.conf, so it can.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# whatsapp-direct part 1: the webhook is public (Meta calls it, no session),
# so it gets its own rate limit here rather than trusting the app alone.
# 5 r/s per source IP with a burst of 10 is generous for one restaurant's
# traffic and far below anything Meta itself would ever send in a legitimate
# retry storm — `nodelay` refuses over-limit requests immediately instead of
# queueing them, so nginx itself does not become the thing that's slow to
# answer. `zone` also caps the memory a flood of distinct source IPs can hold
# (10m ≈ 160k addresses) instead of growing without bound. Also outside
# `server{}` for the same reason as `map` above.
limit_req_zone $binary_remote_addr zone=whatsapp_webhook:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name frybirdiq.tech www.frybirdiq.tech;

    proxy_http_version 1.1;

    # All six set once here so every location inherits the same set, present
    # or future — nginx's inheritance rule is all-or-nothing per location: a
    # location that sets even one proxy_set_header of its own gets NONE of
    # these. That bit `location /` (iq0-s10r-sec, BLOCKER): it used to set
    # Upgrade/Connection locally for streamed Server Actions, which silently
    # discarded Host/X-Real-IP/X-Forwarded-For/X-Forwarded-Proto for every
    # request through `/` — Next's Server Action origin check would have
    # rejected every POS/checkout submission, every client IP would have read
    # 127.0.0.1, and a public request through `/` would have passed the job
    # route's network checks (src/lib/jobs/auth.ts) on headers alone. RED-TEAM
    # F2 found the same class of bug the other direction: /_next/static/ set
    # no proxy_set_header of its own and so got none of these either. Fix for
    # both: no location below sets its own proxy_set_header, ever.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Scheduled jobs (IQ-0 S10): started only by a systemd timer posting to
    # 127.0.0.1:3000 directly, never through nginx. A public GET/POST here
    # gets an empty 404 before it ever reaches the app, so a caller cannot
    # even learn a job route exists — the same thing the app's own header
    # checks refuse, but off the app's own accounting entirely. `^~` stops
    # any future regex location from taking priority, and this location is
    # declared before /_next/static/ so a path that resolves through it
    # (e.g. RED-TEAM F2's /_next/static/%2e%2e/%2e%2e/api/jobs/heartbeat)
    # cannot fall through to the proxying location instead.
    location ^~ /api/jobs/ {
        return 404;
    }

    # whatsapp-direct part 1: Meta's verify handshake (GET) and event
    # notifications (POST) — public, no session, gated by the app itself on
    # the verify token / X-Hub-Signature-256. A real Cloud API payload is a
    # few KB; 512k is generous headroom while still bounding the request
    # nginx will ever hand to Node (the route also checks this, independently
    # — see MAX_BODY_BYTES in src/app/api/whatsapp/webhook/route.ts). `^~`
    # for the same reason as /api/jobs/ above: stop a future regex location
    # from taking priority over this exact match.
    location ^~ /api/whatsapp/webhook {
        limit_req zone=whatsapp_webhook burst=10 nodelay;
        client_max_body_size 512k;
        proxy_pass http://127.0.0.1:3000;
    }

    # Next sets its own caching headers per route; nginx must not second-guess
    # them, or a dynamic page gets served stale to the next customer.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Immutable build assets. Hashed filenames, so a year is safe.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The staff area and a customer's own order pages are nobody's business to
    # index. The app also sets robots meta on those routes; this is the copy a
    # crawler reads first.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /app/\nDisallow: /account/\nDisallow: /order/\nDisallow: /checkout\nAllow: /\nSitemap: https://frybirdiq.tech/sitemap.xml\n";
    }

    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
