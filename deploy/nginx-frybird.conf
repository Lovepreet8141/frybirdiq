# nginx for frybirdiq.tech — the FRYBIRD ordering app and FRYBIRD IQ.
#
#   sudo cp deploy/nginx-frybird.conf /etc/nginx/sites-available/frybird
#   sudo ln -sf /etc/nginx/sites-available/frybird /etc/nginx/sites-enabled/frybird
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue certificates:
#   sudo certbot --nginx -d frybirdiq.tech -d www.frybirdiq.tech
#
# certbot rewrites this file to add the TLS lines and a redirect from port 80.
# Run it after this is in place, not before.

server {
    listen 80;
    listen [::]:80;
    server_name frybirdiq.tech www.frybirdiq.tech;

    # Next sets its own caching headers per route; nginx must not second-guess
    # them, or a dynamic page gets served stale to the next customer.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server Actions and streamed responses need these.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Immutable build assets. Hashed filenames, so a year is safe.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The staff area and a customer's own order pages are nobody's business to
    # index. The app also sets robots meta on those routes; this is the copy a
    # crawler reads first.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /app/\nDisallow: /account/\nDisallow: /order/\nDisallow: /checkout\nAllow: /\n";
    }

    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
